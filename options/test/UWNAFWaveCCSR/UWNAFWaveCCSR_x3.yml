name: test_UWNAFWaveCCSR-x3
model_type: ImageRestorationModel
scale: 3
num_gpu: 1
manual_seed: 10

datasets:
  test_1:
    name: ufo120-test-x3
    type: PairedImageDataset
    dataroot_gt: E:/MBY/data/UFO-120/TEST/hr_x3
    dataroot_lq: E:/MBY/data/UFO-120/TEST/lrx3
    meta_info_file: ~
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: UWNAFWaveCCSRLocal
  img_channel: 3
  width: 40
  up_scale: 3
  low_blk_num: 3
  high_blk_num: 6
  middle_blk_num: 3
  enc_blk_nums: [1, 2, 2, 3]
  dec_blk_nums: [1, 1, 1, 2]

  high_boost: 0.35
  sr_res_scale: 1.0
  rgb_color_residual: 0.005
  use_rgb_color_stabilizer: true

  use_enhance_head: true
  return_enhance: false
  enhance_residual_scale: 0.025
  use_enhance_feedback: true
  enhance_feedback_scale: 0.08
  enhance_feedback_hidden: 40

  use_wavelet_attention: true
  wavelet_attention_blocks: 2
  wavelet_attention_scale: 0.08

  use_region_fusion: true
  mask_hidden: 20
  return_mask: false
  use_prompt_fusion: false
  prompt_dim: 16
  prompt_hidden: 32

  use_low_rank_adapters: false
  adapter_rank: 8
  adapter_scale: 0.1

  use_local_dense_trunk: true
  local_dense_blocks: 6
  local_dense_growth: 32

  hr_refine_blocks: 6
  hr_detail_scale: 0.05
  use_dense_high_branch: true
  high_dense_blocks: 3
  dense_growth: 32
  use_dense_hr_refine: false
  use_edge_guided_detail: false
  detail_gate_bias: 0.0
  use_residual_multiplier: false
  residual_multiplier_gain: 0.0
  residual_multiplier_bias: 0.0

  train_size: [1, 3, 96, 96]
  fast_imp: false

path:
  pretrain_network_g: experiments/UWNAFWaveCCSR-x3/models/net_g_best.pth
  strict_load_g: true

val:
  save_img: true
  grids: false
  rgb2bgr: true
  use_image: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 3
      test_y_channel: false
    ssim:
      type: calculate_external_rgb_ssim
      crop_border: 3
      test_y_channel: false
