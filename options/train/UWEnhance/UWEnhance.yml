name: UWEnhance
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: UWEnhance
    type: PairedImageDataset
    dataroot_gt: E:/MBY/data/LSUI/train/GT
    dataroot_lq: E:/MBY/data/LSUI/train/input
    meta_info_file: ~
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_flip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: UWEnhance
    type: PairedImageDataset
    dataroot_gt: E:/MBY/data/LSUI/val/GT
    dataroot_lq: E:/MBY/data/LSUI/val/input
    meta_info_file: ~
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: UWEnhance
  img_channel: 3
  width: 40
  low_blk_num: 3
  high_blk_num: 4
  middle_blk_num: 3
  enc_blk_nums: [1, 2, 2, 3]
  dec_blk_nums: [1, 1, 1, 2]
  high_boost: 0.25
  enhance_residual_scale: 0.08

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999

  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 1e-5
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [160000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 160000
  warmup_iter: -1

  pixel_opt:
    type: UWSRLoss
    loss_weight: 1.0
    edge_weight: 0.004
    grad_weight: 0.003
    sobel_weight: 0.0
    fft_weight: 0.0
    dwt_weight: 0.0008
    lap_pyr_weight: 0.0005
    edge_aware_weight: 0.0
    false_edge_weight: 0.0
    cmi_weight: 0.0
    ssim_weight: 0.0
    ms_ssim_weight: 0.14
    luma_ms_ssim_weight: 0.04
    external_rgb_ssim_weight: 0.22
    lr_consistency_weight: 0.0
    hf_decay_start_iter: 0
    hf_decay_end_iter: 0
    hf_min_scale: 0.20
    color_weight: 0.012
    ratio_weight: 0.012
    lowfreq_color_weight: 0.012
    red_weight: 0.0
    red_excess_weight: 0.0
    eps: !!float 1e-3
    reduction: mean

  aux_pixel_opt: ~
  multi_output_loss_weights: ~

  use_grad_clip: true
  grad_clip_norm: 1.0

val:
  val_freq: !!float 5e3
  save_img: false
  rgb2bgr: true
  use_image: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_external_rgb_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
