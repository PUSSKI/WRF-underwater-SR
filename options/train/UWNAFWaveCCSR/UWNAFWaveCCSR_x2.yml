name: UWNAFWaveCCSR-x2
model_type: ImageRestorationModel
scale: 2
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: ufo120-train
    type: PairedImageDataset
    dataroot_gt: E:/MBY/data/UFO-120/train_val/hr
    dataroot_lq: E:/MBY/data/UFO-120/train_val/lrd
    meta_info_file: ~
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_flip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ufo120-test
    type: PairedImageDataset
    dataroot_gt: E:/MBY/data/UFO-120/TEST/hr
    dataroot_lq: E:/MBY/data/UFO-120/TEST/lrd
    meta_info_file: ~
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: UWNAFWaveCCSRLocal
  img_channel: 3
  width: 40
  up_scale: 2
  low_blk_num: 3
  high_blk_num: 6
  middle_blk_num: 3
  enc_blk_nums: [1, 2, 2, 3]
  dec_blk_nums: [1, 1, 1, 2]

  high_boost: 0.35
  sr_res_scale: 1.0
  rgb_color_residual: 0.005
  use_rgb_color_stabilizer: true

  use_enhance_head: true
  return_enhance: true
  enhance_residual_scale: 0.025
  use_enhance_feedback: true
  enhance_feedback_scale: 0.08
  enhance_feedback_hidden: 40

  use_wavelet_attention: true
  wavelet_attention_blocks: 2
  wavelet_attention_scale: 0.08

  use_region_fusion: true
  mask_hidden: 20
  return_mask: false
  use_prompt_fusion: false
  prompt_dim: 16
  prompt_hidden: 32

  use_low_rank_adapters: false
  adapter_rank: 8
  adapter_scale: 0.1

  use_local_dense_trunk: true
  local_dense_blocks: 6
  local_dense_growth: 32

  hr_refine_blocks: 6
  hr_detail_scale: 0.05
  use_dense_high_branch: true
  high_dense_blocks: 3
  dense_growth: 32
  use_dense_hr_refine: false
  use_edge_guided_detail: false
  detail_gate_bias: 0.0
  use_residual_multiplier: false
  residual_multiplier_gain: 0.0
  residual_multiplier_bias: 0.0

  train_size: [1, 3, 128, 128]
  fast_imp: false

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999

  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 1e-5
    betas: [0.9, 0.99]

  new_module_lr_keywords: [enhance_head, enhance_feedback]
  new_module_lr_mult: 1.0

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [100000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 160000
  warmup_iter: -1

  pixel_opt:
    type: UWSRLoss
    loss_weight: 1.0
    edge_weight: 0.006
    grad_weight: 0.0
    sobel_weight: 0.0
    fft_weight: 0.0
    dwt_weight: 0.0010
    lap_pyr_weight: 0.0
    edge_aware_weight: 0.0
    false_edge_weight: 0.0
    cmi_weight: 0.0
    ssim_weight: 0.0
    ms_ssim_weight: 0.06
    luma_ms_ssim_weight: 0.0
    external_rgb_ssim_weight: 0.22
    lr_consistency_weight: 0.0
    hf_decay_start_iter: 0
    hf_decay_end_iter: 0
    hf_min_scale: 0.20
    color_weight: 0.008
    ratio_weight: 0.008
    lowfreq_color_weight: 0.0
    red_weight: 0.0
    red_excess_weight: 0.0
    eps: !!float 1e-3
    reduction: mean

  aux_pixel_opt:
    type: AuxEnhanceLoss
    loss_weight: 1.0
    color_weight: 0.004
    ratio_weight: 0.004
    eps: !!float 1e-3
    reduction: mean

  multi_output_loss_weights: [0.08, 1.0]

  use_grad_clip: true
  grad_clip_norm: 1.0

val:
  val_freq: !!float 5e3
  save_img: false
  rgb2bgr: true
  use_image: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: false
    ssim:
      type: calculate_external_rgb_ssim
      crop_border: 2
      test_y_channel: false

logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
